# The disruption-test application, admitted to the cluster.
#
# The manifests live in app-gitops; this file is the platform's half of the
# handover, and it holds what the application repository is not allowed to decide:
#
#   - the Namespace — the `apps` AppProject denies cluster-scoped resources, so an
#     application cannot create its own;
#   - its labels — joining the ambient mesh and attaching routes to the shared
#     gateway are both granted here, not requested there;
#   - the Application itself, under the `apps` project, so everything it syncs is
#     held to app-* namespaces and namespaced kinds.
#
# Synced by the `tenants` Application (apps/11-tenants.yaml), which already runs
# after the NodePool and the gateway this application's pods and route need.
apiVersion: v1
kind: Namespace
metadata:
  name: app-sim
  labels:
    istio.io/dataplane-mode: ambient
    gateway-access: "true"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-sim
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  # Three sources from the same repository: the shared service chart, the values
  # file it is rendered with (`ref: values` is what `$values` names), and the plain
  # manifests that are not a service — the load generator.
  sources:
    - repoURL: https://github.com/gulinux86/app-gitops
      targetRevision: main
      path: charts/service
      helm:
        # The release name is the resource name: Deployment, Service, PDB and
        # HTTPRoute are all `sim`, as the plain manifests before the chart were.
        releaseName: sim
        valueFiles:
          - $values/apps/sim/values.yaml
    - repoURL: https://github.com/gulinux86/app-gitops
      targetRevision: main
      ref: values
    - repoURL: https://github.com/gulinux86/app-gitops
      targetRevision: main
      path: apps/sim/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: app-sim
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
