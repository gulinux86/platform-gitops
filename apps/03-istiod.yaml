# istiod — wave 3. The control plane.
#
# profile: ambient is what makes this an ambient mesh rather than a sidecar one.
# It changes what istiod programs: ztunnel and waypoints instead of injecting a
# proxy container into every pod.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  # Same two runtime-owned fields as istio-base, on a different object: this chart
  # ships the revisioned `istio-validator-istio-system`, while base ships
  # `istiod-default-validator`. One controller writes to both, so both need the
  # same exemption.
  #
  # caBundle: the chart ships the field empty and istiod injects the CA.
  #
  # failurePolicy: the chart ships `Ignore` and istiod's webhook controller flips it
  # to `Fail` once the validation endpoint is ready — permissive while it starts,
  # fail-closed afterwards. With selfHeal on, Argo CD reverting that reopens a
  # window in which Istio configuration is validated fail-open on every pass.
  #
  # This declares both fields as not ours. Everything else in the webhook stays
  # reconciled.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
        - .webhooks[]?.failurePolicy

  sources:
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: istiod
      targetRevision: 1.30.3
      helm:
        valueFiles:
          - $values/components/istio/istiod.yaml
    - repoURL: https://github.com/gulinux86/platform-gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
