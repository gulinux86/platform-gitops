# istio-base — wave 2. CRDs and cluster roles only, no workloads.
#
# Everything else in Istio is an instance of something declared here, so it has to
# land first. Splitting the control plane across four charts is what lets the waves
# express that: one chart would make the ordering invisible.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  # Cascading delete stops at an Application without this finalizer.
  #
  # Only the root carried it, so `kubectl delete applications --all` removed these
  # as plain objects and orphaned everything they had created — which is how PR #33
  # in the terraform repo left a Gateway behind, and with it an NLB that blocked the
  # VPC. With the finalizer, deleting the root actually deletes what each child owns.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  # istiod writes to its own webhooks at runtime, so two fields on this object are
  # owned by that controller rather than by Git. Argo CD compares them against the
  # chart's values and reports OutOfSync forever — and with selfHeal on, it reverts
  # istiod's write and istiod writes back, indefinitely.
  #
  # caBundle: the chart ships the field empty and istiod injects the CA.
  #
  # failurePolicy: the chart ships `Ignore` and istiod's webhook controller flips it
  # to `Fail` once the validation endpoint is ready — permissive while it starts,
  # fail-closed afterwards. Letting Argo CD win here is actively wrong: every pass
  # through the loop reopens a window in which Istio configuration is validated
  # fail-open, so this was never only a red mark on a dashboard.
  #
  # This declares both fields as not ours. Everything else in the webhook stays
  # reconciled.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
        - .webhooks[]?.failurePolicy

  sources:
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: base
      targetRevision: 1.30.3
      helm:
        valueFiles:
          - $values/components/istio/istio-base.yaml
    - repoURL: https://github.com/gulinux86/platform-gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
