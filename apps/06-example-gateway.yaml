# The example Gateway and HTTPRoute — wave 6, last.
#
# Everything before it is machinery; this is the proof that the machinery works.
# It needs the Gateway API CRDs (wave 0) and a programmed Istio control plane
# (wave 3), which is why it comes last rather than first.
#
# Delete this Application once real routes exist. It is scaffolding, not platform.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-gateway
  namespace: argocd
  # Cascading delete stops at an Application without this finalizer.
  #
  # Only the root carried it, so `kubectl delete applications --all` removed these
  # as plain objects and orphaned everything they had created — which is how PR #33
  # in the terraform repo left a Gateway behind, and with it an NLB that blocked the
  # VPC. With the finalizer, deleting the root actually deletes what each child owns.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: platform
  source:
    repoURL: https://github.com/gulinux86/platform-gitops
    targetRevision: main
    path: components/examples
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  syncPolicy:
    # The Gateway only accepts routes from namespaces carrying this label — an
    # opt-in, so a namespace cannot publish itself through the shared gateway by
    # accident. CreateNamespace alone does not set labels, and applying it with
    # kubectl would vanish on the next teardown, so Argo CD owns it here.
    managedNamespaceMetadata:
      labels:
        gateway-access: "true"
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
