# istio-cni — wave 4. Required by ambient, not optional.
#
# In ambient mode there is no sidecar to intercept traffic, so redirection happens
# at the node. This DaemonSet configures that; without it, pods join the mesh in
# name only and their traffic never reaches ztunnel.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argocd
  # Cascading delete stops at an Application without this finalizer.
  #
  # Only the root carried it, so `kubectl delete applications --all` removed these
  # as plain objects and orphaned everything they had created — which is how PR #33
  # in the terraform repo left a Gateway behind, and with it an NLB that blocked the
  # VPC. With the finalizer, deleting the root actually deletes what each child owns.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform
  sources:
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: cni
      targetRevision: 1.30.3
      helm:
        valueFiles:
          - $values/components/istio/istio-cni.yaml
    - repoURL: https://github.com/gulinux86/platform-gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
