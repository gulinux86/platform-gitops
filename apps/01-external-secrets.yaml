# External Secrets Operator — wave 1, with cert-manager.
#
# It depends on nothing in the earlier waves (its webhook certificate comes from its
# own cert controller, not from cert-manager), and everything that will consume a
# secret comes later: platform components such as Backstage, and every tenant in
# wave 11. Early is also what lets a platform component in any later wave ship an
# ExternalSecret beside it.
#
# What the operator may read, and why it has no AWS identity of its own, is in
# components/external-secrets/values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  # Cascading delete stops at an Application without this finalizer; see
  # apps/02-istio-base.yaml for what that once left behind.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  sources:
    # The chart repository must be in the platform AppProject's sourceRepos, which
    # Terraform owns (`platform_source_repos` in eks-terraform). Without it Argo CD
    # refuses this Application with "repo is not permitted".
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.15.0
      helm:
        valueFiles:
          - $values/components/external-secrets/values.yaml
    - repoURL: https://github.com/gulinux86/platform-gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are larger than the last-applied-configuration annotation that
      # client-side apply writes allows; server-side apply has no such annotation.
      - ServerSideApply=true
