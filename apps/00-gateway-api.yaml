# Gateway API CRDs — wave 0.
#
# Everything else in phase 1 depends on these existing first: Istio's gateway
# controller watches Gateway and HTTPRoute, and an HTTPRoute applied before its
# CRD simply fails. Sync waves are what make that ordering explicit; Argo CD does
# not infer it.
#
# Sourced from the upstream repository at a tag rather than vendored here, so the
# version is a single line to review and the manifests are never edited by hand.
# The "standard" channel carries Gateway, GatewayClass and HTTPRoute — the
# experimental channel adds TCPRoute and friends, which nothing here needs yet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  # Cascading delete stops at an Application without this finalizer.
  #
  # Only the root carried it, so `kubectl delete applications --all` removed these
  # as plain objects and orphaned everything they had created — which is how PR #33
  # in the terraform repo left a Gateway behind, and with it an NLB that blocked the
  # VPC. With the finalizer, deleting the root actually deletes what each child owns.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api
    targetRevision: v1.6.1
    path: config/crd/standard
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # CRDs exceed the annotation size limit that client-side apply uses to
      # store last-applied state. Without this the sync fails on the CRD itself.
      - ServerSideApply=true
