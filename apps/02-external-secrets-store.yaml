# The ClusterSecretStore — wave 2, after the operator.
#
# Split from wave 1 for the reason apps/08-karpenter-nodes.yaml gives: it is an
# instance of a CRD the operator's chart installs, and applied together the instance
# usually loses the race.
#
# Before wave 11, where the tenants that use it arrive.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-store
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  source:
    repoURL: https://github.com/gulinux86/platform-gitops
    targetRevision: main
    path: components/external-secrets
    directory:
      recurse: false
      # values.yaml belongs to the operator's Helm release in wave 1. Applied here as
      # a manifest it would be a document with no kind, and the sync fails.
      exclude: "values.yaml"
  destination:
    server: https://kubernetes.default.svc
    # Cluster-scoped. The namespace only decides where Argo CD records it.
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The CRD may still be arriving from wave 1 on a fresh cluster; retry instead of
    # leaving the sync failed until the next change.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
