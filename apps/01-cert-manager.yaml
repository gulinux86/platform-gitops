# cert-manager — wave 1.
#
# Not required by Istio ambient itself, which issues its own workload identities.
# It is here for TLS that is issued and renewed rather than pasted in by hand — what
# any real Gateway wants, and what the external ingress path will need.
#
# This comment used to name the ADOT operator as the reason. That was one of two
# directions the repository carried at once; observability went to an in-cluster
# Prometheus instead (wave 9), so the operator is not coming. A comment that promises
# something the platform will not do is worse than no comment.
#
# Multi-source: the chart comes from the Jetstack repository, the values from this
# one. `ref: values` names the second source so `$values` can address it — a chart
# repository holds no files of ours, so the two must be declared separately.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  # Cascading delete stops at an Application without this finalizer.
  #
  # Only the root carried it, so `kubectl delete applications --all` removed these
  # as plain objects and orphaned everything they had created — which is how PR #33
  # in the terraform repo left a Gateway behind, and with it an NLB that blocked the
  # VPC. With the finalizer, deleting the root actually deletes what each child owns.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.1
      helm:
        valueFiles:
          - $values/components/cert-manager/values.yaml
    - repoURL: https://github.com/gulinux86/platform-gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # cert-manager's CRDs exceed the annotation size limit that client-side
      # apply uses to store last-applied state.
      - ServerSideApply=true
