# External Secrets Operator: how a secret in AWS Secrets Manager becomes a Secret in
# a namespace, without its value ever being in Git.
#
# Rule 1 of this repository has always said "use an ExternalSecret"; until this
# chart, nothing in the cluster could act on one.
#
# Authentication: the controller holds one AWS identity, through EKS Pod Identity —
# eks-terraform (workload/modules/external-secrets-identity) binds a role reading
# apps/* in Secrets Manager to this namespace's `external-secrets` ServiceAccount.
# Nothing here names the role or the account: the binding lives on the AWS side.
#
# Every application's ExternalSecret is served through one ClusterSecretStore, `aws`
# (cluster-secret-store.yaml), which uses that identity. Admitting an application is
# therefore a change in Git, never a Terraform apply.
#
# What keeps applications out of each other's secrets is not IAM, since the role can
# read every application's prefix, but the API server: components/policies/
# tenant-secrets.yaml admits an ExternalSecret in app-<name> only for keys under
# apps/<name>/, and refuses in application namespaces
# every object that would use the controller's credentials on its own terms — a
# SecretStore with no auth of its own, a PushSecret, a generator.

# The name eks-terraform's Pod Identity association binds the role to. The chart
# would derive the same one from the release name; it is pinned so that renaming the
# Application cannot silently leave the controller with no credentials.
serviceAccount:
  name: external-secrets

# Two of each component, on two nodes, never both evicted at once — the floor every
# component on the traffic or deploy path is held to (see the README's "Availability
# through a node roll"). Not an HPA: the controller and the cert controller are
# leader-elected, so a third replica is another standby, and the webhook's load is
# one admission call per ExternalSecret change.
#
# Without leader election two controllers would reconcile the same ExternalSecret
# and race each other's writes; the chart leaves it off because its default is one
# replica.
replicaCount: 2
leaderElect: true

# Hard on hostname, soft on zone, for the reasons in components/istio/istiod.yaml.
# The chart adds each component's own labelSelector when none is given.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Memory request equals its limit, the convention across this repository: Karpenter
# packs by requests, and a pod that grows past its request can land on a node that
# cannot hold it. The controller's memory grows with the number of ExternalSecrets
# it caches — raise this before it is OOM-killed, not after.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 128Mi

# Off for now: the ServiceMonitor CRD arrives with kube-prometheus-stack in wave 9,
# and this chart syncs in wave 1. Turning it on here would fail the sync on a fresh
# cluster until then.
serviceMonitor:
  enabled: false

# Validates ExternalSecret and SecretStore objects on admission, failurePolicy Fail
# (the chart's default): a malformed store is refused when applied rather than
# discovered when a secret fails to arrive. Fail-closed is why it needs the same
# two replicas and PDB as the controller — with none Ready, every ExternalSecret
# change is refused.
webhook:
  replicaCount: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 64Mi

# Issues and rotates the webhook's serving certificate itself, so the webhook does
# not depend on cert-manager. Leader-elected through the same `leaderElect`.
certController:
  replicaCount: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 64Mi
