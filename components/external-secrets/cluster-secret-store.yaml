# The one store every application's ExternalSecret names: AWS Secrets Manager, read
# with the controller's own identity (EKS Pod Identity, from eks-terraform).
#
# No `auth` block: the provider falls back to the controller's credentials, which is
# the point — no ServiceAccount, role ARN or account ID per application.
#
# `conditions` limits which namespaces may use it to those a tenant file admits with
# `secrets: true` (tenants/ labels them). Which keys each of those may read is the
# admission policy's job (components/policies/tenant-secrets.yaml): this object
# cannot express "apps/<name>/ for app-<name>".
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
  conditions:
    - namespaceSelector:
        matchLabels:
          platform/secrets: "true"
