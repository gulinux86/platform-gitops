# What keeps one application out of another's secrets.
#
# The External Secrets Operator reads Secrets Manager with one identity (EKS Pod
# Identity, a role reading apps/*), through one ClusterSecretStore, `aws`. That makes
# admitting an application a change in Git rather than a Terraform apply — and it
# means IAM no longer tells applications apart. The API server does, here.
#
# The `apps` AppProject lets an application create any namespaced object, so two
# policies close the two ways in:
#
#   tenant-secrets-objects  refuses, in an app-* namespace, every external-secrets
#                           object except ExternalSecret. Each one would act with the
#                           controller's credentials on the application's terms: a
#                           SecretStore with no `auth` falls back to them and reads any
#                           key; an STSSessionToken generator hands them out; a
#                           PushSecret writes with them.
#
#   tenant-secrets-scope    admits an ExternalSecret in app-<name> only if it reads
#                           through the `aws` ClusterSecretStore and every key it names
#                           is under apps/<name>/. The prefix comes from the namespace's
#                           name, which an application cannot change: the `apps` project
#                           cannot create or modify a Namespace.
#                           `dataFrom.find` (search by name or tag) and per-key
#                           `sourceRef` are refused: neither names a key this policy
#                           could check.
#
# A key given as an ARN does not start with apps/ and is refused, which is what stops
# arn:aws:secretsmanager:...:secret:apps/<another app>/... from slipping through.
#
# Fail closed, as in workload-resilience.yaml: in-process CEL, no webhook to be down.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-secrets-objects
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secretstores", "pushsecrets"]
      - apiGroups: ["generators.external-secrets.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["*"]
  matchConditions:
    - name: application-namespace
      expression: request.namespace.startsWith('app-')
  validations:
    - expression: "false"
      messageExpression: >-
        object.kind + ' ' + request.namespace + '/' + object.metadata.name + ': not
        allowed in an application namespace — it would act with the credentials of
        the External Secrets Operator. Read secrets with an ExternalSecret through the
        ClusterSecretStore `aws`.'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-secrets-objects
spec:
  policyName: tenant-secrets-objects
  validationActions: [Deny, Audit]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-secrets-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["externalsecrets"]
  matchConditions:
    - name: application-namespace
      expression: request.namespace.startsWith('app-')

  variables:
    # app-orders -> apps/orders/
    - name: prefix
      expression: "'apps/' + request.namespace.substring(4) + '/'"
    - name: data
      expression: "has(object.spec.data) ? object.spec.data : []"
    - name: dataFrom
      expression: "has(object.spec.dataFrom) ? object.spec.dataFrom : []"
    # Every key the object names: data[].remoteRef.key and dataFrom[].extract.key.
    - name: keys
      expression: >-
        variables.data.filter(d, has(d.remoteRef)).map(d, d.remoteRef.key)
        + variables.dataFrom.filter(e, has(e.extract)).map(e, e.extract.key)
    - name: outside
      expression: >-
        variables.keys.filter(k,
        !(k.startsWith(variables.prefix) && size(k) > size(variables.prefix)))
    - name: where
      expression: "'ExternalSecret ' + request.namespace + '/' + object.metadata.name"

  validations:
    - expression: >-
        has(object.spec.secretStoreRef) && has(object.spec.secretStoreRef.kind)
        && object.spec.secretStoreRef.kind == 'ClusterSecretStore'
        && object.spec.secretStoreRef.name == 'aws'
      messageExpression: >-
        variables.where + ': secretStoreRef must be the ClusterSecretStore `aws`'
      reason: Forbidden

    - expression: >-
        variables.data.all(d, !has(d.sourceRef))
        && variables.dataFrom.all(e, has(e.extract) && !has(e.find) && !has(e.sourceRef))
      messageExpression: >-
        variables.where + ': only data[].remoteRef and dataFrom[].extract are allowed —
        find and sourceRef read keys this policy cannot check'
      reason: Forbidden

    - expression: size(variables.outside) == 0
      messageExpression: >-
        variables.where + ': ' + variables.outside.join(', ') + ' — this application
        reads only ' + variables.prefix + '*'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-secrets-scope
spec:
  policyName: tenant-secrets-scope
  validationActions: [Deny, Audit]
