# A Gateway and an HTTPRoute that prove the ingress path end to end.
#
# There is no Helm chart for the gateway itself. With Gateway API, creating a
# Gateway resource is enough: Istio's controller sees the gatewayClassName and
# provisions the proxy Deployment and Service for it. That is the modern path and
# the reason the istio/gateway chart is absent from apps/.
#
# The generated Service is ClusterIP, forced by the ConfigMap below. That single
# word is what keeps this repository from creating AWS resources.
#
# Istio defaults it to LoadBalancer, and the AWS Load Balancer Controller answers a
# LoadBalancer Service with an NLB — one that Terraform never records. Its ENIs
# then hold the private subnets and the subnets hold the VPC, which is what failed
# four consecutive `terraform destroy` runs on 2026-08-24. Nobody chose that NLB;
# it arrived because a default met a controller.
#
# The load balancer now lives in Terraform (`workload/modules/platform-ingress` in
# the eks-terraform repository) and reaches these pods through a
# TargetGroupBinding. So the edge is still an AWS load balancer — it is simply
# owned by the layer that can also destroy it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-gateway-options
  # Must be the Gateway's namespace. Istio's controller ignores a parametersRef
  # pointing outside it, silently, and the Service reverts to the default.
  namespace: istio-ingress
data:
  # A strategic merge patch over the Service Istio generates. This is the
  # documented customisation path for Gateway API in Istio 1.30 — deliberately
  # chosen over the `networking.istio.io/service-type` annotation, which appears in
  # blog posts but is absent from Istio's own annotation reference and is therefore
  # not a contract to build a teardown guarantee on.
  service: |
    spec:
      type: ClusterIP

  # Two replicas, on two nodes, and never both evicted at once.
  #
  # Every request — the ALB's, the loadgen's — enters through this proxy. With one
  # replica and no PDB, draining its node (a node-group roll during an EKS upgrade)
  # cut all ingress until the pod came back elsewhere, however well each app behind
  # it was protected. Istio creates neither the PDB nor a second replica unless
  # asked; both keys below are the documented customisation path.
  #
  # Hard spread on hostname: two replicas on one node fail together. No HPA — a
  # fixed two is the availability floor; scaling on load is a separate decision.
  #
  # The preStop sleep is for the load balancer in front. A terminating pod leaves the
  # Service at once, but the ALB learns it from the controller deregistering the
  # target, seconds later — and keeps sending it requests until then. Sleeping first
  # keeps Envoy serving through that gap; the native sleep action needs no shell in
  # the distroless proxy image. Containers merge by name, so this adds to the
  # generated istio-proxy container rather than replacing it.
  #
  # 40s, not the 15 it was: the gap is not always seconds. The hml 1.35 -> 1.36
  # upgrade of 2026-10-31 drained a system node holding both a gateway pod and the
  # Load Balancer Controller's leader. No controller deregistered anything until a
  # new leader took over, 21s later; the pod had stopped at 15, and the ALB sent
  # three requests to it (one 502, two connection failures). 40 covers a leader
  # change plus the ALB's own propagation. The grace period has to exceed it, or
  # the kubelet kills Envoy mid-sleep: 60, from Kubernetes' default 30.
  #
  # And only on Karpenter's nodes. The system node group runs the controller, so a
  # gateway there can be drained in the same moment as the thing that would
  # deregister it — which is how the above happened. On Karpenter's nodes the
  # gateway moves in eks-upgrade's last phase, when the controller is settled, the
  # same rule that moves applications last. Pending until Karpenter's first nodes
  # exist after a fresh deploy; nothing waits on it, since the root Application
  # does not gate waves on a child's health.
  deployment: |
    spec:
      replicas: 2
      template:
        spec:
          terminationGracePeriodSeconds: 60
          containers:
            - name: istio-proxy
              lifecycle:
                preStop:
                  sleep:
                    seconds: 40
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: karpenter.sh/nodepool
                        operator: Exists
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: platform-gateway
  podDisruptionBudget: |
    spec:
      minAvailable: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-gateway
  namespace: istio-ingress
spec:
  gatewayClassName: istio

  # Points at the ConfigMap above. `group: ""` is the core API group, which is what
  # a ConfigMap lives in.
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: platform-gateway-options

  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          # Routes may only attach from namespaces carrying this label. The
          # alternative — From: All — lets any namespace publish itself through the
          # shared gateway, which is exactly the accident a platform boundary
          # exists to prevent.
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
---
# Smallest possible proof that the path works: Gateway → HTTPRoute → Service.
# It routes to the demo backend in app-demo, which exists purely so this path can
# be proven end to end: Gateway → HTTPRoute → Service → pod, through the mesh.
# Real applications belong in the separate app repository.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example
  namespace: istio-ingress
spec:
  parentRefs:
    - name: platform-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /healthz
      backendRefs:
        - name: example-app
          namespace: app-demo
          port: 80
---
# Cross-namespace references are denied by default in Gateway API, and that is the
# whole point: without this, any route in any namespace could send traffic to any
# service anywhere. The grant is issued by the *target* namespace — app-demo
# decides who may reach it, not the other way round.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-ingress-routes
  namespace: app-demo
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: istio-ingress
  to:
    - group: ""
      kind: Service
      name: example-app
