# A minimal backend so the example route resolves.
#
# Without it the HTTPRoute reports BackendNotFound and the Application sits
# Degraded forever — and a dashboard with a permanent red mark trains people to
# ignore red marks. With it, the path is proven end to end: Gateway → HTTPRoute →
# Service → pod, through the ambient mesh.
#
# It lives in the platform repository, not the application one, because it is not
# an application: it is the smoke test for the traffic path. Delete it once real
# workloads route through the gateway.
apiVersion: v1
kind: Namespace
metadata:
  name: app-demo
  labels:
    # Opts this namespace into the ambient mesh. Without it the pods run fine and
    # simply never join — no sidecar to be missing, no error, just traffic that
    # bypasses ztunnel. That silence is why ambient needs the label checked
    # explicitly rather than assumed.
    istio.io/dataplane-mode: ambient
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: app-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: nginx
          # The unprivileged variant, not the stock nginx image. The official one
          # starts as root and drops privilege for its workers, so under
          # runAsNonRoot with all capabilities dropped it cannot create
          # /var/cache/nginx and crash-loops. This one is built to run as a normal
          # user and listens on 8080, since binding 80 needs a capability we do
          # not want to grant.
          #
          # Pinned rather than `latest`: an image that changes under a fixed
          # manifest defeats the point of GitOps.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101 # the image's built-in nginx user
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  # The HTTPRoute's backendRef names this service. A mismatch here is exactly what
  # BackendNotFound was reporting.
  name: example-app
  namespace: app-demo
spec:
  selector:
    app: demo
  ports:
    - port: 80
      targetPort: 8080 # the service keeps port 80; only the container moved
